name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-platforms:
    name: Simulated logic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - windows-2025
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test

  native-imagemagick:
    name: ImageMagick smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install ImageMagick on Intel macOS
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - name: Verify preinstalled ImageMagick on Windows
        if: runner.os == 'Windows'
        run: magick -version
      - run: npm run test:imagemagick

  linux-docker:
    name: ImageMagick smoke (Linux x64 Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build reproducible Linux test image
        run: docker build --file Dockerfile.test --tag png-webp-companion-test .
      - name: Run ImageMagick smoke test
        run: docker run --rm png-webp-companion-test
